# Scenario: Nominal Steady State
# Continuous NOMINAL sensor windows. No faults. Validates baseline correctness.

name: nominal_steady_state
description: >
  Nominal sensor stream for the full duration. All windows should classify as
  NOMINAL. Mode controller must remain in NORMAL throughout.

duration_s: 30
publish_rate_hz: 10

steps:
  - event_class: NOMINAL
    duration_s: 30
    fault: null

expected_outcomes:
  - ai_output: NOMINAL
    mode: NORMAL
    violations: []
