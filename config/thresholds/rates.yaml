# Classification and agreement rate thresholds
#
# All rates expressed as fractions in [0.0, 1.0] unless noted.
# Checked by: nexus/validation/divergence_validator.py, pass_fail_evaluator.py
# Failure modes covered: FM-02, FM-06, FM-07, FM-08

# INT8 (STM32 TFLite-Micro) vs FP32 (host) classification agreement rate.
# Measures the impact of quantization on classification decisions.
# A disagreement on any CRITICAL_EVENT input is an unconditional failure regardless
# of this threshold (FM-06 takes precedence).
# Failure mode: FM-02
int8_fp32_agreement_min: 0.98

# Rate of CRITICAL_EVENT inputs that the model classifies as anything other than
# CRITICAL_EVENT. This is the most severe failure class in the framework.
# 0.0 means zero misses permitted — any single miss is an unconditional failure.
# Failure mode: FM-06
critical_miss_rate_max: 0.0

# Rate of NOMINAL inputs that the model incorrectly classifies as CRITICAL_EVENT.
# Evaluated on the nominal stimulus distribution only.
# Failure mode: FM-08
false_critical_rate_max: 0.01

# Fraction of published /ai/event_class messages that must be contract-compliant
# (valid event_class value, confidence in [0.0, 1.0]).
# Failure mode: FM-01, FM-05
output_contract_compliance_min: 1.0

# Autonomous recovery from CRITICAL is unconditionally forbidden.
# This threshold exists to make the constraint machine-checkable.
# 0 means zero occurrences permitted across the entire test run.
# Failure mode: FM-09
autonomous_critical_recovery_max: 0
